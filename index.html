<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TATC: Five Nights at the Circus</title><style>
*{box-sizing:border-box}body{margin:0;background:#090611;color:#fff;font:16px Arial,sans-serif;overflow:hidden}button{cursor:pointer;color:#fff;background:#24163d;border:1px solid #8d6ac0;padding:11px 18px}button:hover{background:#39245b}.screen{display:none;position:absolute;inset:0}.active{display:flex}
#menu,#custom,#over,#win{align-items:center;justify-content:center;text-align:center}#menu{background:radial-gradient(circle,#34215b,#090611 65%)}.box{width:min(760px,94vw);padding:30px;background:#100a1d;border:2px solid #8060b5;box-shadow:0 0 50px #000}.logo{font-size:clamp(30px,6vw,62px);font-weight:900;text-shadow:4px 4px #30184e}.sub{color:#c7b9df;margin:10px 0 28px}.menu{display:block;width:min(430px,85%);margin:12px auto;font-size:18px}
#custom{background:#08050e}.list{max-height:65vh;overflow:auto;text-align:left}.row{display:grid;grid-template-columns:1fr 180px 45px;gap:12px;align-items:center;margin:8px 0}.name{padding:8px;background:#1d1230}.actions{display:flex;gap:12px;margin-top:20px}.actions button{flex:1}
#office{background:linear-gradient(#151025 0 75%,#0c0910 75%);position:relative}.wall{position:absolute;inset:0 0 25%;background:radial-gradient(circle at 50% 35%,#38295755,transparent 50%)}.floor{position:absolute;inset:auto 0 0;height:25%;background:repeating-conic-gradient(#17111f 0 25%,#0b0810 0 50%) 0/70px 70px;transform:perspective(300px) rotateX(15deg);transform-origin:bottom}.clock{position:absolute;top:7%;left:50%;transform:translateX(-50%);font-size:40px}.hour{position:absolute;right:18px;top:18px;font-size:25px;font-weight:bold}.power{position:absolute;left:18px;bottom:18px;background:#0008;padding:8px 12px}.side{position:absolute;top:25%;bottom:25%;width:22%;display:flex;flex-direction:column;justify-content:center;gap:10px}.left{left:1%}.right{right:1%}.doorway{height:65%;border:4px solid #514060;background:#030208;position:relative;overflow:hidden}.door{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#77727a 0 18px,#4d4950 18px 30px);transform:translateY(-105%);transition:.12s}.closed{transform:translateY(0)}.light{position:absolute;inset:0;background:#ffffdf00;z-index:3}.lit{background:#ffffdf55}.controls{display:flex;gap:6px;justify-content:center}.desk{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:55%;height:105px;background:#291b38;border:2px solid #62477b}.monitor{position:absolute;left:50%;top:-105px;transform:translateX(-50%);width:300px;height:170px;background:#060509;border:12px solid #29262e}.cams{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:18px}.phone{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#b9aace}
#camera{background:#08070c}.view{position:absolute;inset:0;padding:35px;background:radial-gradient(circle,#282038,#0a080e 70%)}.room{font-size:28px;font-weight:bold}.objects{position:absolute;inset:100px 30px 30px;border:2px solid #39303f}.character{position:absolute;padding:13px 15px;background:#2d2140;border:2px solid #a17bd4;border-radius:9px;font-weight:bold}.moving{animation:f .15s infinite alternate}@keyframes f{to{filter:brightness(1.8)}}.map{position:absolute;right:15px;bottom:15px;background:#000b;padding:12px;width:245px}.map button{font-size:11px;margin:3px;padding:7px}.static{position:absolute;inset:0;opacity:.07;pointer-events:none;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px)}
#over{background:#010102}.gameover{font-size:clamp(45px,9vw,100px);font-weight:900;color:#d21f3a;text-shadow:0 0 25px red}#win{background:#080610}.win{font-size:80px;font-weight:900}
#popup{display:none;position:absolute;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center}.popup{width:min(460px,90vw);padding:28px;background:#160c25;border:2px solid #9872c8;text-align:center}
</style></head><body><div id="game">
<section id="menu" class="screen active"><div class="box"><div class="logo">THE AMAZING<br>TOY-TASTICAL CIRCUS</div><div class="sub">Five Nights at the Circus</div><button class="menu" id="new">NEW GAME</button><button class="menu" id="cont">CONTINUE</button><button class="menu" id="custom">CUSTOM NIGHT</button></div></section>
<section id="custom" class="screen"><div class="box"><h2>CUSTOM NIGHT</h2><p class="sub">Choose any characters. No limit. AI 0–20.</p><div class="list" id="list"></div><div class="actions"><button id="startCustom">START</button><button id="back">BACK</button></div></div></section>
<section id="office" class="screen"><div class="wall"></div><div class="floor"></div><div class="clock" id="clock">12:00</div><div class="hour" id="hour">12 AM</div>
<div class="side left"><div class="doorway"><div class="light" id="ll"></div><div class="door" id="ld"></div></div><div class="controls"><button id="lb">LIGHT</button><button id="ldb">DOOR</button></div></div>
<div class="side right"><div class="doorway"><div class="light" id="rl"></div><div class="door" id="rd"></div></div><div class="controls"><button id="rdb">DOOR</button><button id="rb">LIGHT</button></div></div>
<div class="desk"><div class="monitor"></div></div><button class="cams" id="cams">CAMERAS</button><div class="phone">☎ Chatter Telephone</div><div class="power" id="power">POWER: 100%</div></section>
<section id="camera" class="screen"><div class="view"><div class="room" id="room"></div><div class="objects" id="objects"></div><div class="static"></div><div class="map" id="map"></div></div></section>
<section id="over" class="screen"><div><div class="gameover">GAME OVER</div><p id="reason"></p><button class="menu" id="retry">RETRY</button><button class="menu" id="gomenu">MAIN MENU</button></div></section>
<section id="win" class="screen"><div><div class="win">6 AM</div><p id="wsub">You survived.</p><button class="menu" id="next">NEXT NIGHT</button><button class="menu" id="winmenu">MAIN MENU</button></div></section>
<div id="popup"><div class="popup"><h2 id="pt"></h2><p id="px"></p><button id="py">OK</button></div></div></div>
<script>
const C=[
['XP','Disoriented TATC theme'],['Pippie','Footsteps'],['Prism','Plastic feet dragging'],['Poppie','Soft hum'],['Blox','Soft cat purr'],['Zippy','Squeaky toy'],['Clover','Hoof footsteps'],['Dex','Skateboard falling'],['Clockzo','Clock ticking'],['Marionette','Giggle'],['Milo','Backrooms-inspired sound']
],R={stage:'MAIN STAGE',lounge:'LOUNGE AREA',bed:'BEDROOM HALLWAY',play:'INDOOR PLAYGROUND',kitchen:'KITCHEN',candy:'CANDY SHOP'},
N={stage:['lounge','bed'],lounge:['stage','bed','candy'],bed:['lounge','play','candy'],candy:['lounge','bed'],play:['bed','kitchen'],kitchen:['play']};
let S={night:1,custom:false,power:100,t:0,cam:'stage',chars:[],ld:false,rd:false,ll:false,rl:false,running:false},ints=[];
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function build(){list.innerHTML='';C.forEach((c,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="name">'+c[0]+'</div><input type="range" min="0" max="20" value="0" id="a'+i+'"><b id="v'+i+'">0</b>';list.appendChild(d);d.querySelector('input').oninput=e=>document.getElementById('v'+i).textContent=e.target.value})}
function start(custom=false){ints.forEach(clearInterval);ints=[];S={...S,custom,power:100,t:0,ld:false,rd:false,ll:false,rl:false,running:true};S.chars=C.map((c,i)=>({name:c[0],cue:c[1],ai:custom?+document.getElementById('a'+i).value:Math.min(20,3+S.night*2+Math.floor(Math.random()*5)),pos:'stage',stay:rand(10,20),moving:false,target:null,enc:false,vent:c[0]=='Poppie',ventHere:false})).filter(x=>x.ai>0);update();show('office');ints.push(setInterval(tick,1000));ints.push(setInterval(camera,700));if(!custom&&S.night==1)setTimeout(()=>pop('Chatter Telephone','Watch the cameras, use your lights and doors, conserve power, and survive until 6 AM.'),600)}
function tick(){if(!S.running)return;S.t++;let d=.045+(document.getElementById('camera').classList.contains('active')?.12:0)+(S.ld?.1:0)+(S.rd?.1:0)+(S.ll?.07:0)+(S.rl?.07:0);S.power=Math.max(0,S.power-d);power.textContent='POWER: '+Math.ceil(S.power)+'%';let h=Math.min(5,Math.floor(S.t/90)),hs=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM'];hour.textContent=hs[h];clock.textContent=hs[h];if(S.power<=0){S.ld=S.rd=S.ll=S.rl=false;update()}S.chars.forEach(ai);if(S.t>=540){S.running=false;ints.forEach(clearInterval);ints=[];wsub.textContent=S.custom?'Custom Night survived.':'Night '+S.night+' survived.';show('win')}}
function ai(c){if(c.vent){if(Math.random()<c.ai/500)c.ventHere=true;return}if(c.stay>0){c.stay--;return}if(Math.random()<c.ai/100*.55){let opts=N[c.pos]||[];if(!opts.length)return;let next=shuffle(opts)[0];if(Math.random()<.18){let back=N[c.pos]?.find(x=>x===c.pos);if(back)next=back}c.target=next;c.moving=true;setTimeout(()=>{if(!S.running)return;c.pos=c.target;c.target=null;c.moving=false;c.stay=rand(10,20);bang(c)},900)}if(c.pos==='office'&&!c.enc){c.enc=true;let side=Math.random()<.5?'l':'r';setTimeout(()=>{if(!S.running)return;if(side==='l'?S.ld:S.rd){c.pos='stage';c.enc=false;c.stay=rand(10,20);bang(c)}else lose(c.name+' reached the office.')},2200)}}
function bang(c){try{let a=new Audio('audio/bang.mp3');a.volume=.45;a.play().catch(()=>{})}catch(e){}}
function camera(){if(!document.getElementById('camera').classList.contains('active'))return;room.textContent=R[S.cam];objects.innerHTML='';S.chars.filter(c=>c.pos===S.cam&&!c.ventHere).forEach(c=>{let e=document.createElement('div');e.className='character '+(c.moving?'moving':'');e.textContent=c.name;e.style.left=rand(8,75)+'%';e.style.top=rand(12,70)+'%';objects.appendChild(e)});let p=S.chars.find(c=>c.vent&&c.ventHere);if(p){let e=document.createElement('div');e.className='character';e.textContent='POPPIE • VENT';e.style.left='42%';e.style.top='42%';objects.appendChild(e)}}
function update(){ld.classList.toggle('closed',S.ld);rd.classList.toggle('closed',S.rd);ll.classList.toggle('lit',S.ll);rl.classList.toggle('lit',S.rl)}
function pop(t,x){pt.textContent=t;px.textContent=x;popup.style.display='flex';py.onclick=()=>popup.style.display='none'}
function lose(x){S.running=false;ints.forEach(clearInterval);ints=[];reason.textContent=x;show('over')}
function door(k){if(S.power>0){S[k]=!S[k];update()}}function light(k){if(S.power>0){S[k]=!S[k];update()}}
lb.onclick=()=>light('ll');rb.onclick=()=>light('rl');ldb.onclick=()=>door('ld');rdb.onclick=()=>door('rd');
cams.onclick=()=>S.power>0&&show('camera');camera.onclick=e=>{if(!e.target.closest('.map'))show('office')};
['stage','lounge','bed','play','kitchen','candy'].forEach((x,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+R[x];b.onclick=()=>{S.cam=x;camera()};map.appendChild(b)});
new.onclick=()=>{S.night=1;start(false)};cont.onclick=()=>start(false);custom.onclick=()=>{build();show('custom')};back.onclick=()=>show('menu');startCustom.onclick=()=>start(true);retry.onclick=()=>start(S.custom);gomenu.onclick=winmenu.onclick=()=>show('menu');next.onclick=()=>{S.night=Math.min(5,S.night+1);start(false)};build();
</script></body></html>
