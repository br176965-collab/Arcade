<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Nights At TATC</title><style>
*{box-sizing:border-box}body{margin:0;background:#090712;color:#eee;font-family:Arial,sans-serif;overflow:hidden}button{font:inherit}.screen{display:none;width:100vw;height:100vh}.screen.active{display:flex}.menu{align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#302047,#080611 70%)}h1{font-size:clamp(42px,8vw,100px);letter-spacing:4px;text-align:center;text-shadow:0 0 20px #b25cff,0 0 50px #7a21bd;margin:0 0 45px}.subtitle{color:#bda9d0;letter-spacing:5px;margin-top:-30px;margin-bottom:35px}.menu button{width:320px;margin:8px;padding:15px;background:#171222;color:#eee;border:2px solid #76519b;cursor:pointer}.menu button:hover{background:#3a2350;box-shadow:0 0 18px #9c5dd4}.office{position:relative;background:linear-gradient(90deg,#100d22,#17122c 50%,#100d22);display:block}.wall{position:absolute;inset:0 0 18%;background:radial-gradient(circle at 50% 30%,#342254,#0c0919 70%)}.floor{position:absolute;left:0;right:0;bottom:0;height:25%;background:repeating-linear-gradient(90deg,#252033 0 55px,#171422 55px 110px);transform:perspective(500px) rotateX(55deg);transform-origin:bottom}.desk{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(65vw,800px);height:130px;background:#211a2e;border:4px solid #4e3c5f;border-radius:8px;box-shadow:0 20px 40px #000}.monitor{position:absolute;left:50%;top:-115px;transform:translateX(-50%);width:230px;height:135px;background:#08070b;border:10px solid #39313f;border-radius:8px;box-shadow:0 0 25px #000}.monitor:after{content:'TATC SECURITY';display:grid;place-items:center;color:#8b73a2;height:100%;font-size:14px}.side{position:absolute;top:28%;width:130px;height:310px;background:#09070e;border:5px solid #33263e}.left{left:3%}.right{right:3%}.door{position:absolute;inset:0;background:#4c4755;transform:translateY(-100%);transition:.18s}.door.closed{transform:translateY(0)}.controls{position:absolute;bottom:8%;display:flex;gap:8px}.leftc{left:3%}.rightc{right:3%}.ctrl{background:#25192d;border:2px solid #69477f;color:#eee;padding:12px 15px;cursor:pointer}.ctrl.on{background:#9b3f6b}.ctrl.closed{background:#6d273d}.hud{position:absolute;top:15px;left:20px;font-weight:bold;z-index:5}.hud span{display:block;margin:4px}.camBtn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:15px 40px;background:#251933;border:3px solid #76519b;color:#fff;cursor:pointer}.camera{position:relative;background:#080a0d;display:block}.feed{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#313b40,#101419 65%);overflow:hidden}.feed:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 3px 4px);pointer-events:none}.roomname{position:absolute;top:20px;left:25px;font-size:25px;font-weight:bold;z-index:5}.map{position:absolute;right:20px;top:20px;width:300px;padding:10px;background:#111a;border:2px solid #766}.map button{margin:3px;padding:8px;background:#18131f;color:white;border:1px solid #76519b;cursor:pointer}.obj{position:absolute;font-weight:bold;transition:.5s;z-index:3}.back{position:absolute;bottom:20px;left:20px;padding:12px 25px;background:#21152c;color:white;border:2px solid #76519b;cursor:pointer}.vent{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 25px;background:#4d233e;color:white;border:2px solid #e06aa3;cursor:pointer}.warn{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:26px;color:#ff6b89;text-shadow:0 0 15px #f24;font-weight:900;z-index:10;display:none;text-align:center}.popup{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}.card{width:min(700px,90vw);padding:30px;background:#161020;border:3px solid #76519b;box-shadow:0 0 50px #000}.card button{margin-top:20px;padding:10px 30px;background:#3a2350;color:#fff;border:2px solid #9d70c2}.custom{align-items:center;justify-content:center;flex-direction:column;background:#0d0915}.list{width:min(850px,90vw);max-height:60vh;overflow:auto}.row{display:grid;grid-template-columns:160px 1fr 40px;gap:10px;padding:8px;border-bottom:1px solid #30263b}.custom button{margin:10px;padding:12px 35px;background:#251933;color:#fff;border:2px solid #76519b}.end{align-items:center;justify-content:center;flex-direction:column;background:#08050e}.end h2{font-size:70px;text-shadow:0 0 30px #a24}.end button{padding:15px 40px;background:#251933;color:#fff;border:2px solid #76519b;margin:8px}.phone{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:100px;height:45px;background:#4b294e;border:3px solid #aa6ab5;border-radius:20px;color:#fff;z-index:4}.hidden{display:none!important}
</style></head><body>
<section id="menu" class="screen active menu"><h1>FIVE NIGHTS<br>AT TATC</h1><div class="subtitle">A TATC SECURITY EXPERIENCE</div><button id="newGame">NEW GAME</button><button id="continueGame">CONTINUE</button><button id="customNight">CUSTOM NIGHT</button></section>
<section id="customScreen" class="screen custom"><h2>CUSTOM NIGHT</h2><div id="customList" class="list"></div><div><button id="customStart">START NIGHT</button><button id="customBack">BACK</button></div></section>
<section id="office" class="screen office"><div class="wall"></div><div class="floor"></div><div class="side left"><div id="leftDoor" class="door"></div></div><div class="side right"><div id="rightDoor" class="door"></div></div><div class="desk"><div class="monitor"></div><button id="phone" class="phone">☎</button></div><div class="controls leftc"><button id="leftLight" class="ctrl">LEFT LIGHT</button><button id="leftDoorBtn" class="ctrl">LEFT DOOR</button></div><div class="controls rightc"><button id="rightDoorBtn" class="ctrl">RIGHT DOOR</button><button id="rightLight" class="ctrl">RIGHT LIGHT</button></div><div class="hud"><span id="nightText">NIGHT 1</span><span id="hourText">12 AM</span><span id="powerText">POWER: 100%</span></div><div id="officeWarn" class="warn"></div><button id="cameraBtn" class="camBtn">OPEN CAMERA MONITOR</button></section>
<section id="cameraScreen" class="screen camera"><div id="feed" class="feed"><div id="roomName" class="roomname"></div><div id="objects"></div></div><div id="map" class="map"></div><button id="cameraBack" class="back">CLOSE MONITOR</button><button id="ventFlash" class="vent hidden">FLASH VENT</button></section>
<section id="gameOver" class="screen end"><h2>GAME OVER</h2><p id="reason"></p><button id="retry">RETRY</button><button id="menuOver">MENU</button></section>
<section id="win" class="screen end"><h2>6 AM</h2><p id="winText">Night survived.</p><button id="nextNight">NEXT NIGHT</button><button id="menuWin">MENU</button></section>
<div id="popup" class="popup"><div class="card"><h2 id="popTitle"></h2><p id="popText"></p><button id="popClose">OK</button></div></div>
<script>
'use strict';
const CHARS=[
 ['XP','DISORIENTED TATC CUE'],['Pippie','FOOTSTEPS'],['Prism','PLASTIC DRAG'],['Poppie','SOFT HUM'],['Blox','PURR'],['Zippy','SQUEAK'],['Clover','HOOVES'],['Dex','SKATEBOARD'],['Clockzo','TICKING'],['Marionette','GIGGLE'],['Milo','BACKROOMS CUE']
];
const ROOMS={stage:'MAIN STAGE',lounge:'LOUNGE AREA',bed:'BEDROOM HALLWAY',play:'INDOOR PLAYGROUND',kitchen:'KITCHEN',candy:'CANDY SHOP'};
const LINKS={stage:['lounge','bed'],lounge:['stage','bed','candy'],bed:['lounge','play','candy'],candy:['lounge','bed'],play:['bed','kitchen'],kitchen:['play']};
const OFFICE_ROOMS=['stage','lounge','bed','candy','play','kitchen'];
let state={night:1,custom:false,running:false,time:0,power:100,cam:'stage',ld:false,rd:false,ll:false,rl:false,chars:[]};
let timer=null,camTimer=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function clearTimers(){if(timer)clearInterval(timer);if(camTimer)clearInterval(camTimer);timer=camTimer=null}
function audioTone(freq,dur,type='sine',vol=.05){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur);setTimeout(()=>c.close(),dur*1000+100)}catch(e){}}
function bang(){audioTone(70,.22,'square',.12)}
function cue(name){const f={XP:180,Pippie:95,Prism:65,Poppie:500,Blox:230,Zippy:700,Clover:120,Dex:300,Clockzo:900,Marionette:360,Milo:55}[name]||200;audioTone(f,.18,'triangle',.07)}
function popup(title,text){$('popTitle').textContent=title;$('popText').textContent=text;$('popup').style.display='flex'}
function buildCustom(){const l=$('customList');l.innerHTML='';CHARS.forEach((c,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+c[0]+'</b><input id="ai'+i+'" type="range" min="0" max="20" value="0"><span id="val'+i+'">0</span>';const inp=r.querySelector('input');inp.oninput=()=>r.querySelector('span').textContent=inp.value;l.appendChild(r)})}
function startGame(custom=false){clearTimers();state={...state,custom,running:true,time:0,power:100,ld:false,rd:false,ll:false,rl:false,cam:'stage'};state.chars=CHARS.map((c,i)=>({name:c[0],ai:custom?+$('ai'+i).value:Math.min(20,4+state.night*2+Math.floor(Math.random()*5)),pos:'stage',stay:rnd(8,20),moving:false,target:null,enc:false,side:null,officeTime:3,vent:c[0]==='Poppie',ventHere:false})).filter(c=>c.ai>0);show('office');updateOffice();updateHud();
 if(!custom&&state.night===1)setTimeout(()=>popup('Chatter Telephone','Welcome to your very first day here at TATC security night shift! Listen closley my waffle cookie wood-crafted cheese cracker! There\'s 11 characters, I forgot to feed them, so they\'re hungry for anything. You can interact with the cameras, Doors, lights, your flashlight, and the cute little teddy bear in case you have some scary baby fears you can cuddle with the teddy bear!'),500);
 timer=setInterval(tick,1000);camTimer=setInterval(renderCamera,600);
}
function updateHud(){const h=Math.min(5,Math.floor(state.time/90));$('nightText').textContent=state.custom?'CUSTOM NIGHT':'NIGHT '+state.night;$('hourText').textContent=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM'][h];$('powerText').textContent='POWER: '+Math.ceil(state.power)+'%'}
function tick(){if(!state.running)return;state.time++;let drain=.04+(state.ld?.09:0)+(state.rd?.09:0)+(state.ll?.06:0)+(state.rl?.06:0)+(document.getElementById('cameraScreen').classList.contains('active')?.11:0);state.power=Math.max(0,state.power-drain);if(state.power<=0){state.ld=state.rd=state.ll=state.rl=false;updateOffice()};state.chars.forEach(moveAI);state.chars.forEach(resolveEncounter);updateHud();updateWarning();if(state.time>=540)winGame()}
function moveAI(c){if(c.vent){if(Math.random()<c.ai/450)c.ventHere=true;return}if(c.enc||c.stay>0){if(c.stay>0)c.stay--;return}const moveChance=Math.min(.75,.025+c.ai*.006);if(Math.random()>moveChance)return;const opts=LINKS[c.pos]||[];if(!opts.length)return;let next=shuffle(opts)[0];c.target=next;c.moving=true;cue(c.name);setTimeout(()=>{if(!state.running)return;c.pos=c.target;c.target=null;c.moving=false;c.stay=rnd(8,20);bang()},700+rnd(0,400));}
function resolveEncounter(c){if(c.vent||c.enc)return;if(!OFFICE_ROOMS.includes(c.pos)||c.stay>0)return;const chance=Math.min(.16,.025+c.ai*.006);if(Math.random()<chance){c.enc=true;c.side=Math.random()<.5?'l':'r';c.officeTime=3;updateWarning()}}
function resolveEncounter(c){if(c.vent||!c.enc)return;c.officeTime--;if(c.officeTime<=0){const closed=c.side==='l'?state.ld:state.rd;if(closed){c.pos='stage';c.enc=false;c.side=null;c.stay=rnd(10,20);bang();popup('DOOR BLOCKED',c.name+' retreated from the office.')}else lose(c.name+' reached the office.')}}
function updateWarning(){const c=state.chars.find(x=>x.enc&&!x.vent);const w=$('officeWarn');if(c){w.textContent=c.name+' AT '+(c.side==='l'?'LEFT':'RIGHT')+' DOOR';w.style.display='block'}else w.style.display='none'}
function updateOffice(){$('leftDoor').classList.toggle('closed',state.ld);$('rightDoor').classList.toggle('closed',state.rd);$('leftLight').classList.toggle('on',state.ll);$('rightLight').classList.toggle('on',state.rl);$('leftDoorBtn').classList.toggle('closed',state.ld);$('rightDoorBtn').classList.toggle('closed',state.rd)}
function renderCamera(){if(!state.running||!$('cameraScreen').classList.contains('active'))return;$('roomName').textContent=ROOMS[state.cam];const box=$('objects');box.innerHTML='';state.chars.filter(c=>c.pos===state.cam&&!c.ventHere).forEach(c=>{const e=document.createElement('div');e.className='obj';e.textContent=c.name+(c.moving?' • MOVING':'');e.style.left=rnd(15,75)+'%';e.style.top=rnd(25,75)+'%';box.appendChild(e)});const p=state.chars.find(c=>c.vent&&c.ventHere);$('ventFlash').classList.toggle('hidden',!p)}
function openCamera(){if(state.power<=0)return;show('cameraScreen');renderCamera()}
function lose(reason){state.running=false;clearTimers();$('reason').textContent=reason;show('gameOver')}
function winGame(){state.running=false;clearTimers();$('winText').textContent=state.custom?'Custom Night survived.':'Night '+state.night+' survived.';$('nextNight').classList.toggle('hidden',state.custom||state.night>=5);show('win')}
function toggle(k){if(state.power<=0)return;state[k]=!state[k];updateOffice()}
$('newGame').onclick=()=>{state.night=1;startGame(false)};
$('continueGame').onclick=()=>startGame(false);
$('customNight').onclick=()=>{buildCustom();show('customScreen')};
$('customStart').onclick=()=>startGame(true);$('customBack').onclick=()=>show('menu');$('cameraBtn').onclick=openCamera;$('cameraBack').onclick=()=>show('office');
$('leftLight').onclick=()=>toggle('ll');$('rightLight').onclick=()=>toggle('rl');$('leftDoorBtn').onclick=()=>toggle('ld');$('rightDoorBtn').onclick=()=>toggle('rd');
$('ventFlash').onclick=()=>{const p=state.chars.find(c=>c.vent&&c.ventHere);if(p){p.ventHere=false;bang();popup('VENT CLEAR','Poppie retreated from the vent.')}};
$('retry').onclick=()=>startGame(state.custom);$('menuOver').onclick=()=>{clearTimers();show('menu')};$('menuWin').onclick=()=>{clearTimers();show('menu')};$('nextNight').onclick=()=>{state.night=Math.min(5,state.night+1);startGame(false)};$('popClose').onclick=()=>$('popup').style.display='none';
const map=$('map');Object.entries(ROOMS).forEach(([id,name],i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+name;b.onclick=()=>{state.cam=id;renderCamera()};map.appendChild(b)});
buildCustom();
</script></body></html>
